name: Copybara sync gate

# Block a PR here while the monorepo has changes to the TileDB subtree that
# are not yet exported and merged back (the crossing-changes hazard). Two
# unsynced states are checked: an open export PR here, and monorepo TileDB/
# commits after the hub's last-export ref. Copybara's own export PRs are exempt.
# Enforce as a branch-protection required check.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Exempt copybara sync PRs
        id: exempt
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Sync PRs (copybara/*) are exempt. Pass explicitly rather than
          # skipping the job, so a required-check branch rule still gets a
          # green result and the export PR stays mergeable.
          case "$HEAD_REF" in
            copybara/*) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Sync PR ($HEAD_REF): gate not applicable; passing." ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Require monorepo exports to be current
        if: steps.exempt.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("copybara/from-monorepo-"))] | length')
          if [ "$open" != 0 ]; then
            echo "::error::A pending export PR from the monorepo is open; merge it before merging other work (crossing changes)."
            exit 1
          fi
          umask 077
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$RUNNER_TEMP/git-credentials"
          git config --global credential.helper "store --file=$RUNNER_TEMP/git-credentials"
          HUB=https://github.com/TileDB-Inc/tiledb-monorepo.git
          # Commit/tree only (no blobs): enough to walk history for the count.
          git clone -q --filter=blob:none --no-checkout "$HUB" hub
          cd hub
          LASTREV=$(git ls-remote origin refs/heads/copybara/last-rev-TileDB | awk '{print $1}')
          if [ -z "$LASTREV" ]; then
            echo "::error::No hub last-rev-TileDB ref yet; failing closed."
            exit 1
          fi
          git fetch -q --filter=blob:none origin main "$LASTREV"
          n=$(git rev-list --count "$LASTREV..FETCH_HEAD" -- TileDB/ 2>/dev/null) \
            || n=$(git rev-list --count "$LASTREV..origin/main" -- TileDB/)
          if [ "$n" = 0 ]; then
            echo "Monorepo exports are current (last export $LASTREV)."
          else
            echo "::error::The monorepo has $n unexported TileDB commit(s) after the last export; wait for the export PR and merge it first."
            exit 1
          fi
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/git-credentials"
